name: SunwayMinecraft
version: '1.6-SNAPSHOT'
main: com.sunwayMinecraft.SunwayMinecraft
api-version: '1.21'
softdepend: [Vault, Essentials, GriefPrevention]

commands:
  pausebeacons:
    description: "Pause the beacon color transitions."
    usage: "/pausebeacons"
    permission: "sunwayminecraft.beacons.pause"

  resumebeacons:
    description: "Resume the beacon color transitions."
    usage: "/resumebeacons"
    permission: "sunwayminecraft.beacons.resume"

  reloadsunwayconfig:
    description: "Reloads the SunwayMinecraft plugin configuration."
    usage: "/reloadsunwayconfig"
    permission: "sunwayminecraft.config.reload"

  setbeaconticks:
    description: "Set the number of ticks per beacon color transition."
    usage: "/setbeaconticks <ticks>"
    permission: "sunwayminecraft.beacons.setticks"

  reloadsunwaybenches:
    description: "Reload bench configurations"
    usage: "/reloadsunwaybenches"
    permission: "sunwayminecraft.benches.reload"

  listbenches:
    description: "List all bench regions"
    usage: "/listbenches"
    permission: "sunwayminecraft.benches.list"

  benchinfo:
    description: "Show bench region details"
    usage: "/benchinfo <name>"
    permission: "sunwayminecraft.benches.info"

  checkbenchregion:
    description: "Check current bench region"
    usage: "/checkbenchregion"
    permission: "sunwayminecraft.benches.check"

  findpets:
    description: "Find your tamed pets in loaded chunks"
    usage: "/findpets [player]"
    permission: "sunwayminecraft.petfinder.use"

  findcontainers:
    description: "Scan nearby loaded chunks for containers"
    usage: "/findcontainers [radius] | /findcontainers page <number>"
    permission: "sunwayminecraft.containerfinder.use"

  findpetsinarea:
    description: "Search for pets in a specific area"
    usage: "/findpetsinarea <x1> <y1> <z1> <x2> <y2> <z2> [player]"
    permission: "sunwayminecraft.petfinder.admin"

  scanlights:
    description: "Scan for light blocks in current region"
    usage: "/scanlights"
    permission: "sunwayminecraft.switches.scanlights"

  exportlights:
    description: "Export light positions to file"
    usage: "/exportlights <filename>"
    permission: "sunwayminecraft.switches.exportlights"

  listlightregions:
    description: "List all defined light regions"
    usage: "/listlightregions"
    permission: "sunwayminecraft.switches.listregions"

  checklightregion:
    description: "Check if you're in a light region"
    usage: "/checklightregion"
    permission: "sunwayminecraft.switches.checkregion"

  lightinfo:
    description: "Show information about targeted light block"
    usage: "/lightinfo"
    permission: "sunwayminecraft.switches.info"

  reloadsunwayswitches:
    description: "Reload switch configurations"
    usage: "/reloadsunwayswitches"
    permission: "sunwayminecraft.switches.reload"

  servertime:
    description: "Displays the server's real-world time and date"
    usage: "/servertime"

  servertimeutc:
    description: "Shows server time in UTC"
    usage: "/servertimeutc"

  cf:
    description: "Coin flip game command"
    usage: "/cf <amount> <heads|tails> OR /cf item <amount> <heads|tails> OR /cf [mute|unmute|help]"

  mineworld:
    description: "Teleport to the mining world"
    usage: "/mineworld"
    permission: "sunway.world.mining"

  lifeworld:
    description: "Teleport to the living world"
    usage: "/lifeworld"
    permission: "sunway.world.living"

  mininginfo:
    description: Show information about the Mining World
    usage: /mininginfo
    permission: sunway.worldtravel.info

  miningopen:
    description: Set the Mining World state to OPEN
    usage: /miningopen
    permission: sunway.worldtravel.admin

  miningresetpending:
    description: Set the Mining World state to RESET_PENDING
    usage: /miningresetpending
    permission: sunway.worldtravel.admin

  mininglock:
    description: Set the Mining World state to LOCKED
    usage: /mininglock
    permission: sunway.worldtravel.admin

  miningevacuate:
    description: Start a Mining World evacuation countdown
    usage: /miningevacuate <seconds>
    permission: sunway.worldtravel.admin

  miningevaccancel:
    description: Cancel the active Mining World evacuation
    usage: /miningevaccancel
    permission: sunway.worldtravel.admin

  miningstate:
    description: Show the current Mining World state
    usage: /miningstate
    permission: sunway.worldtravel.admin

  residency:
    description: Residency commands for renting and managing city units
    usage: /residency <list|view|rent|myunits|pay|guests>
    permission: sunway.residency.use

  storefront:
    description: Storefront commands for city commercial units
    usage: /storefront <list>
    permission: sunway.storefront.use
    aliases: [store, shops]

  resadmin:
    description: Admin commands for residency and storefront management
    usage: /resadmin <subcommand>
    permission: sunway.residency.admin

  district:
    description: Show district information
    usage: /district [list|info <id>]
    permission: sunway.districts.use

  districtadmin:
    description: Admin commands for district management
    usage: /districtadmin <list|info|at|validate|reload>
    permission: sunway.districts.admin

  contracts:
    description: City Contracts system commands
    usage: /contracts <subcommand>
    permission: sunway.contracts.use

  contractadmin:
    description: Admin commands for City Contracts
    usage: /contractadmin <subcommand>
    permission: sunway.contracts.admin

  events:
    description: City Events system commands
    usage: /events <subcommand>
    permission: sunway.events.use

  eventadmin:
    description: Admin commands for City Events
    usage: /eventadmin <subcommand>
    permission: sunway.events.admin

permissions:
  sunway.contracts.use:
    description: Allows players to use the City Contracts board and accept contracts.
    default: true

  sunway.contracts.admin:
    description: Allows admins to manage City Contracts.
    default: op

  sunway.events.use:
    description: Allows players to view City Events.
    default: true

  sunway.events.admin:
    description: Allows admins to manage City Events.
    default: op

  sunwayminecraft.beacons.pause:
    description: "Allows the user to pause beacon color transitions."
    default: op
... (rest of permissions)
