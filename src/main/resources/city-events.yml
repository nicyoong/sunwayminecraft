events:
  supply_drive:
    type: SUPPLY_DRIVE
    name: "Municipal Supply Drive"
    description: "The city needs extra materials for expansion. Hauling payouts are boosted!"
    scope: CITY
    reward_multiplier: 1.5
    default_duration_minutes: 120
    boosted_categories:
      - HAULING
      - COURIER
  inspection_week:
    type: INSPECTION_WEEK
    name: "Safety Inspection Week"
    description: "Inspectors are checking city assets. Maintenance and Survey work is a priority."
    scope: CITY
    reward_multiplier: 1.25
    default_duration_minutes: 10080 # 1 week
    boosted_categories:
      - MAINTENANCE
      - SURVEY
  mining_rush:
    type: MINING_RUSH
    name: "Golden Vein Discovery"
    description: "New mineral veins found in the mining world! Recovery work is highly valued."
    scope: CITY_MINING
    reward_multiplier: 2.0
    default_duration_minutes: 180
    boosted_categories:
      - RECOVERY
      - HAULING
  market_promotion:
    type: MARKET_WEEK
    name: "Trade Promotion"
    description: "Economic stimulus for logistics. All delivery tasks pay better."
    scope: CITY_MAIN
    reward_multiplier: 1.3
    default_duration_minutes: 1440 # 1 day
    boosted_categories:
      - COURIER
      - HAULING
